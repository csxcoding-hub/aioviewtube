name: Build Windows App (x64 & x86)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE (x64 & ia32)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove any cached Linux lockfiles
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { Remove-Item -Force "package-lock.json" }
          if (Test-Path "bun.lock") { Remove-Item -Force "bun.lock" }

      - name: Install Project Dependencies for Windows
        run: npm install --legacy-peer-deps

      - name: Ensure Windows Rolldown Native Binding
        run: npm install @rolldown/binding-win32-x64-msvc --legacy-peer-deps --save-optional
        continue-on-error: true

      - name: Install Electron & Builder
        run: npm install --save-dev electron electron-builder --legacy-peer-deps

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Build Windows Installers and Portables (x64 & ia32/x86)
        run: npx electron-builder --win --x64 --ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (x64 & x86 .exe)
        uses: actions/upload-artifact@v4
        with:
          name: LoopTube-Windows-Binaries
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
